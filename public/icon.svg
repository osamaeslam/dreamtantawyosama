<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#334155" stroke-width="8"/>
  
  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="190" fill="url(#primaryGrad)" stroke="#f59e0b" stroke-width="12"/>
  
  <!-- Luxury Monogram Arabic Taa (ط) & Modern Enterprise Emblem -->
  <path d="M190 290 C 190 230, 290 230, 290 290 C 290 320, 230 320, 190 290 Z" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="260" y1="160" x2="260" y2="295" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
  <line x1="170" y1="295" x2="350" y2="295" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
  
  <!-- Accent Gold Star/Diamond -->
  <polygon points="310,180 322,192 310,204 298,192" fill="#f59e0b"/>
</svg>
