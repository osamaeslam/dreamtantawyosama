        const container = document.getElementById('toast-container');
        if (!container) return;
        const toast = document.createElement('div');
        const colors = {
          success: 'bg-[#0b1f14] text-emerald-300 border-emerald-500/40 shadow-emerald-500/20',
          error: 'bg-[#2b0d13] text-rose-300 border-rose-500/40 shadow-rose-500/20',
          info: 'bg-[#1e1708] text-amber-300 border-amber-500/40 shadow-amber-500/20'
        };
        const icons = { success: '✓', error: '✕', info: 'ℹ' };
        toast.className = `toast-animate pointer-events-auto w-full flex items-center gap-3 px-4 py-3 rounded-2xl border shadow-2xl backdrop-blur-xl text-xs font-bold ${colors[type] || colors.success}`;

        container.appendChild(toast);

          toast.style.transition = 'all 0.3s ease';

        // Sync pending orders
        const pendingOrders = JSON.parse(localStorage.getItem('tantawy_offline_orders') || '[]');
        if (pendingOrders.length > 0) {
          const remainingOrders = [];
          for (const order of pendingOrders) {
            try {
              const res = await fetch(`${SUPABASE_URL}orders`, {
                method: 'POST',
                headers,
                body: JSON.stringify(order)
              });
              if (res.ok) {
                syncedCount++;
              } else {
                remainingOrders.push(order);
              }
            } catch (e) {
              remainingOrders.push(order);
            }
          }
          state.pendingOrders = remainingOrders;
          localStorage.setItem('tantawy_offline_orders', JSON.stringify(remainingOrders));
        }

        // Sync pending visits
        const pendingVisits = JSON.parse(localStorage.getItem('tantawy_offline_visits') || '[]');
        if (pendingVisits.length > 0) {
          const remainingVisits = [];
          for (const visit of pendingVisits) {
            try {
              const res = await fetch(`${SUPABASE_URL}visits`, {
                method: 'POST',
                headers,
                body: JSON.stringify(visit)
              });
              if (res.ok) {
                syncedCount++;
              } else {
                remainingVisits.push(visit);
              }
            } catch (e) {
              remainingVisits.push(visit);
            }
          }
          state.pendingVisits = remainingVisits;
          localStorage.setItem('tantawy_offline_visits', JSON.stringify(remainingVisits));
        }

        if (syncedCount > 0) {
          showToast(`تمت مزامنة ${syncedCount} معاملة أوفلاين بنجاح مع Supabase!`, 'success');
          await Promise.all([fetchOrders(), fetchVisits()]);
          render();
        }
      }

      async function apiLogin(identifier, password) {
        const clean = identifier.trim();
        const cleanPass = password.trim();

        // 1. Try RPC function app_login first
        try {
          const rpcRes = await fetch(`${SUPABASE_URL}rpc/app_login`, {
            method: 'POST',
            headers,
            body: JSON.stringify({ p_username: clean, p_password: cleanPass })
          });
          if (rpcRes.ok) {
            const data = await rpcRes.json();
            const u = Array.isArray(data) ? data[0] : data;
            if (u && u.id) {
              return {
                id: u.id,
                name: u.name || u.username,
                email: u.email || u.username || clean,
                role: u.role || 'مندوب مبيعات',
                branch: u.branch_name || u.branch || 'المركز الرئيسي'
              };
            }
          }
        } catch (rpcErr) {
          console.warn("RPC login check:", rpcErr);
        }

        // 2. Direct query fallback
        try {
          const tables = ['app_users', 'users'];
          for (const tbl of tables) {
            const endpoint = `${SUPABASE_URL}${tbl}?or=(email.ilike.*${encodeURIComponent(clean)}*,name.ilike.*${encodeURIComponent(clean)}*,username.ilike.*${encodeURIComponent(clean)}*,id.eq.${encodeURIComponent(clean)})&select=*&limit=1`;
            const res = await fetch(endpoint, { headers });
            if (res.ok) {
              const rows = await res.json();
              if (rows.length > 0) {
                const u = rows[0];
                if (u.password === cleanPass || !u.password) {
                  return {
                    id: u.id,
                    name: u.name || u.username || 'مستخدم',
                    email: u.email || u.username || clean,
                    role: u.role || 'مندوب مبيعات',
                    branch: u.branch_name || u.branch || 'المركز الرئيسي'
                  };
                }
              }
            }
          }
        } catch (e) {
          console.error("Direct login error:", e);
        }

        // 3. Preset fallback user check for smooth testing
        const matchedPreset = PRESET_USERS.find(p => 
          p.username.toLowerCase() === clean.toLowerCase() || 
          p.email.toLowerCase() === clean.toLowerCase() ||
          p.name.includes(clean)
        );
        if (matchedPreset) {
          return matchedPreset;
        }

        return null;
      }

      async function postNewVisit(visitData) {
        if (!navigator.onLine) {
          state.pendingVisits.push(visitData);
          localStorage.setItem('tantawy_offline_visits', JSON.stringify(state.pendingVisits));
          state.visits.unshift(visitData);
          return visitData;
        }
        try {
          const res = await fetch(`${SUPABASE_URL}visits`, {
            method: 'POST',
            headers,
            body: JSON.stringify(visitData)
          });
          if (!res.ok) throw new Error(await res.text());
          const saved = await res.json();
          state.visits.unshift(Array.isArray(saved) ? saved[0] : visitData);
          return saved;
        } catch (err) {
          // Fallback to offline queue
          state.pendingVisits.push(visitData);
          localStorage.setItem('tantawy_offline_visits', JSON.stringify(state.pendingVisits));
          state.visits.unshift(visitData);
          return visitData;
        }
      }

      window.confirmSettleDebt = async (clientCode, amount, isFullZeroing, settlementNotes) => {
        const client = state.clients.find(c => c.client_code === clientCode);
        if (!client) return;

        const currentDebt = Number(client.debt || 0);
        const paidAmount = Number(amount || 0);
        const newDebt = isFullZeroing ? 0 : Math.max(0, currentDebt - paidAmount);

        client.debt = newDebt;

          client.legal_status = 'تمت التسوية وتصفير المديونية وإغلاق الملف';

        if (!client.legal_notes) client.legal_notes = [];

      // ------------------------------------------
      // COMPONENT: LIVE REP TARGET PROGRESS BAR
      // (Requested Feature 5: شريط متابعة التارجت اليومي)
      // ------------------------------------------
      function renderLiveTargetBar() {
        const u = state.currentUser;
        if (!u || isLegal(u.role)) return '';

        // Calculate actual rep sales & collections
        const repOrders = state.orders.filter(o => !isRep(u.role) || (o.delegate_name && o.delegate_name.includes(u.name)));
        const repVisits = state.visits.filter(v => !isRep(u.role) || (v.mandoub_name && v.mandoub_name.includes(u.name)));

        const achievedSales = repOrders.reduce((sum, o) => sum + (Number(o.total) || 0), 0);
        const achievedCollections = repVisits.reduce((sum, v) => sum + (Number(v.amount) || 0), 0);

        // Daily targets
        const dailyTargetSales = 25000;
        const dailyTargetCollection = 15000;

        const salesPct = Math.min(100, Math.round((achievedSales / dailyTargetSales) * 100));
        const collectionPct = Math.min(100, Math.round((achievedCollections / dailyTargetCollection) * 100));

        return `
          <section class="max-w-7xl mx-auto w-full px-4 sm:px-6 pt-4">
            <div class="glass-card rounded-3xl p-4 sm:p-5 border-amber-500/25">
              <div class="flex flex-col lg:flex-row items-start lg:items-center justify-between gap-4">
                
                <!-- Title & Motivation -->
                <div class="flex items-center gap-3">
                  <div class="w-11 h-11 rounded-2xl bg-amber-500/15 border border-amber-500/30 flex items-center justify-center text-amber-400 shrink-0">
                    <i data-lucide="target" class="w-6 h-6"></i>
                  </div>
                  <div>
                    <div class="flex items-center gap-2">
                      <h3 class="font-bold text-sm text-white">شريط متابعة التارجت اليومي</h3>
                      <span class="text-[10px] px-2.5 py-0.5 rounded-full font-bold ${collectionPct >= 80 ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' : 'bg-amber-500/20 text-amber-300 border border-amber-500/40'}">
                        ${collectionPct >= 80 ? 'أداء استثنائي! 🚀' : 'مستمر في التقدم 💪'}
                      </span>
                    </div>
                    <p class="text-[11px] text-slate-400 mt-0.5">
                      متابعة حية لنسبة تحقيق الهدف البيعي والتحصيلي لحسابك اليوم
                    </p>
                  </div>
                </div>

                <!-- Two Interactive Progress Gauges -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 w-full lg:w-3/5">
                  
                  <!-- 1. Daily Sales Target -->
                  <div class="bg-[#080d19] p-3 rounded-2xl border border-slate-800/80 space-y-1.5">
                    <div class="flex items-center justify-between text-xs">
                      <span class="text-slate-300 font-bold flex items-center gap-1.5">
                        <i data-lucide="trending-up" class="w-3.5 h-3.5 text-amber-400"></i>
                        <span>تارجت المبيعات اليومي:</span>
                      </span>
                      <span class="text-amber-400 font-mono font-bold">${achievedSales.toLocaleString()} / ${dailyTargetSales.toLocaleString()} ج.م</span>
                    </div>
                    <div class="w-full bg-slate-900 h-2 rounded-full overflow-hidden">
                      <div class="bg-gradient-to-r from-amber-500 to-amber-400 h-full rounded-full transition-all duration-500" style="width: ${salesPct}%"></div>
                    </div>
                    <div class="flex justify-between text-[10px] text-slate-500 font-mono">
                      <span>إنجاز: ${salesPct}%</span>
                      <span>متبقي: ${Math.max(0, dailyTargetSales - achievedSales).toLocaleString()} ج.م</span>
                    </div>
                  </div>

                  <!-- 2. Daily Collection Target -->
                  <div class="bg-[#080d19] p-3 rounded-2xl border border-slate-800/80 space-y-1.5">
                    <div class="flex items-center justify-between text-xs">
                      <span class="text-slate-300 font-bold flex items-center gap-1.5">
                        <i data-lucide="dollar-sign" class="w-3.5 h-3.5 text-emerald-400"></i>
                        <span>تارجت التحصيل اليومي:</span>
                      </span>
                      <span class="text-emerald-400 font-mono font-bold">${achievedCollections.toLocaleString()} / ${dailyTargetCollection.toLocaleString()} ج.م</span>
                    </div>
                    <div class="w-full bg-slate-900 h-2 rounded-full overflow-hidden">
                      <div class="bg-gradient-to-r from-emerald-500 to-teal-400 h-full rounded-full transition-all duration-500" style="width: ${collectionPct}%"></div>
                    </div>
                    <div class="flex justify-between text-[10px] text-slate-500 font-mono">
                      <span>إنجاز: ${collectionPct}%</span>
                      <span>متبقي: ${Math.max(0, dailyTargetCollection - achievedCollections).toLocaleString()} ج.م</span>
                    </div>
                  </div>

                </div>

              </div>
            </div>
          </section>
        `;
      }

            // ------------------------------------------

      // ------------------------------------------

        const overLimitCount = state.clients.filter(c => Number(c.debt || 0) > Number(c.credit_limit || 50000)).length;
        const regularCount = totalClientsCount - overLimitCount - legalClientsCount;

        const filtered = state.clients.filter(c => {
          // Branch filter
          const matchBranch = state.selectedBranch === 'الكل' || (c.branch && c.branch.includes(state.selectedBranch));
          if (!matchBranch) return false;

          // Category filter
          if (state.clientCategoryFilter === 'منتظم') {
            if (c.is_legal || Number(c.debt || 0) > Number(c.credit_limit || 50000)) return false;
          } else if (state.clientCategoryFilter === 'تجاوز_الحد') {
            if (Number(c.debt || 0) <= Number(c.credit_limit || 50000)) return false;
          } else if (state.clientCategoryFilter === 'شؤون_قانونية') {
            if (!c.is_legal) return false;
          }

          // Search
          if (!state.clientSearch) return true;
          const q = state.clientSearch.toLowerCase();
          return (c.client_name && c.client_name.toLowerCase().includes(q)) ||
                 (c.client_code && c.client_code.toLowerCase().includes(q)) ||
                 (c.mandoub_name && c.mandoub_name.toLowerCase().includes(q)) ||
                 (c.phone && c.phone.includes(q));
        });

        const totalDebt = filtered.reduce((sum, c) => sum + (Number(c.debt) || 0), 0);

      // ------------------------------------------
      // TAB 4: ORDERS & APPROVAL WORKFLOW
      // (Requested Feature 4: دورة الاعتماد الرقمي للطلبيات)
      // ------------------------------------------
      function renderOrdersTab() {
        const u = state.currentUser;
        const canApprove = isAdmin(u.role) || isSupervisor(u.role);

        const filteredOrders = state.orders.filter(o => {
          if (state.ordersFilter === 'الكل') return true;
          if (state.ordersFilter === 'معلق') return (o.status || '').includes('انتظار') || (o.status || '').includes('معلق');
          if (state.ordersFilter === 'معتمد') return (o.status || '').includes('معتمد');
          if (state.ordersFilter === 'مرفوض') return (o.status || '').includes('مرفوض');
          return true;
        });

        const pendingCount = state.orders.filter(o => (o.status || '').includes('انتظار') || (o.status || '').includes('معلق')).length;
        const approvedCount = state.orders.filter(o => (o.status || '').includes('معتمد')).length;
        const rejectedCount = state.orders.filter(o => (o.status || '').includes('مرفوض')).length;

        return `
          <div class="space-y-5">
            <div class="glass-card rounded-3xl p-5 flex flex-col md:flex-row items-center justify-between gap-4">

                <i data-lucide="shopping-bag" class="w-4 h-4"></i>

                onclick="setOrdersFilter('معلق')"

              >
                قيد الاعتماد (${pendingCount})
              </button>

              <button 
                onclick="setOrdersFilter('معتمد')" 
                class="px-3.5 py-1.5 rounded-xl font-bold transition cursor-pointer ${state.ordersFilter === 'معتمد' ? 'bg-amber-500 text-gray-950 font-black shadow-md' : 'bg-[#0e1626] text-emerald-400 hover:text-white border border-slate-800'}"
              >
                المعتمدة (${approvedCount})
              </button>

              <button 
                onclick="setOrdersFilter('مرفوض')" 
                class="px-3.5 py-1.5 rounded-xl font-bold transition cursor-pointer ${state.ordersFilter === 'مرفوض' ? 'bg-amber-500 text-gray-950 font-black shadow-md' : 'bg-[#0e1626] text-rose-400 hover:text-white border border-slate-800'}"

                const isPending = (o.status || '').includes('انتظار') || (o.status || '').includes('معلق');

                const isRejected = (o.status || '').includes('مرفوض');

                let statusBadgeColor = 'bg-amber-500/15 text-amber-300 border-amber-500/30';

                    ${canApprove && isPending ? `
                      <div class="bg-[#080d19] p-3 rounded-2xl border border-amber-500/30 space-y-2">

                            <span>تعليق للتحصيل</span>

                          <i data-lucide="printer" class="w-3.5 h-3.5"></i>
                          <span>أمر توريد</span>
                        </button>
                      </div>
                    </div>

                  </div>
                `;
              }).join('')}
            </div>

          </div>
        `;
      }

      window.setOrdersFilter = (f) => {
        state.ordersFilter = f;
        render();
      };

      // ------------------------------------------

            if (!c.legal_assigned_to || !c.legal_assigned_to.includes(u.name)) return false;

          // Search
          if (!state.legalSearch) return true;
          const q = state.legalSearch.toLowerCase();
          return (c.client_name && c.client_name.toLowerCase().includes(q)) ||

                 (c.phone && c.phone.includes(q)) ||
                 (c.branch && c.branch.toLowerCase().includes(q)) ||

                <div class="text-2xl font-black text-amber-400 font-mono mt-2">${inActionCount}</div>

                <button 
                  onclick="setLegalFilter('تمت_التسوية')" 
                  class="px-3.5 py-1.5 rounded-xl font-bold transition cursor-pointer shrink-0 ${state.legalFilter === 'تمت_التسوية' ? 'bg-emerald-500 text-gray-950 font-black shadow-md' : 'bg-[#080d19] text-emerald-300 hover:text-emerald-200 border border-emerald-500/30'}"

                  >
                    قضايا مسندة لي شخصياً
                  </button>
                ` : ''}
              </div>
            </div>

            <!-- 4. LEGAL CASES CARDS LIST -->
            <div class="space-y-4">
              ${filtered.length === 0 ? `
                <div class="glass-card rounded-3xl p-12 text-center text-slate-400 space-y-2">
                  <i data-lucide="folder-check" class="w-12 h-12 text-slate-600 mx-auto"></i>

                  <p class="text-xs text-slate-500">يمكنك تغيير فلتر الحالة أو تحويل عملاء جدد من تبويب العملاء.</p>
                </div>
              ` : filtered.map(c => {
                const debt = Number(c.debt || 0);
                const limit = Number(c.credit_limit || 50000);
                const isPendingReceipt = c.legal_status === 'بانتظار استلام الملف';
                const isSettled = c.legal_status && c.legal_status.includes('تسوية');
                const latestNote = (c.legal_notes && c.legal_notes.length > 0) ? c.legal_notes[0] : null;

                let statusBadgeColor = 'bg-amber-500/20 text-amber-300 border-amber-500/40';
                if (isPendingReceipt) statusBadgeColor = 'bg-rose-500/20 text-rose-300 border-rose-500/40 animate-pulse';
                else if (isSettled) statusBadgeColor = 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40';
                else if (c.legal_status && c.legal_status.includes('أمر')) statusBadgeColor = 'bg-purple-500/20 text-purple-300 border-purple-500/40';

                return `
                  <div class="glass-card rounded-3xl p-5 sm:p-6 space-y-4 border-slate-700/80 hover:border-amber-500/40 transition">
                    
                    <!-- Card Header -->
                    <div class="flex flex-col lg:flex-row items-start lg:items-center justify-between gap-3 border-b border-slate-800/80 pb-4">
                      <div class="flex items-start gap-3.5">
                        <div class="w-12 h-12 rounded-2xl ${isSettled ? 'bg-emerald-500/15 border-emerald-500/30 text-emerald-400' : 'bg-rose-500/15 border-rose-500/30 text-rose-400'} border flex items-center justify-center shrink-0">
                          <i data-lucide="${isSettled ? 'shield-check' : 'scale'}" class="w-6 h-6"></i>
                        </div>
                        <div>
                          <div class="flex flex-wrap items-center gap-2">
                            <h3 class="font-black text-base text-white">${escapeHtml(c.client_name)}</h3>
                            <span class="text-xs px-2.5 py-0.5 rounded-full font-bold border ${statusBadgeColor}">
                              ${escapeHtml(c.legal_status || 'قيد المتابعة')}
                            </span>
                          </div>
                          <div class="text-xs text-slate-400 flex flex-wrap items-center gap-3 mt-1">
                            <span class="font-mono text-amber-400 font-bold">${escapeHtml(c.client_code)}</span>
                            <span>• الفرع: <strong class="text-white">${escapeHtml(c.branch || '---')}</strong></span>
                            <span>• المندوب: <strong class="text-slate-300">${escapeHtml(c.mandoub_name || 'غير محدد')}</strong></span>
                            <span>• الهاتف: <strong class="font-mono text-slate-200">${escapeHtml(c.phone || '---')}</strong></span>
                          </div>
                        </div>
                      </div>

                      <!-- Financial Figures & Lawyer -->
                      <div class="flex items-center gap-4 text-left">
                        <div class="bg-[#080d19] px-4 py-2.5 rounded-2xl border border-slate-800">
                          <span class="text-[10px] text-slate-400 block">المديونية المتعثرة</span>
                          <strong class="text-base font-black font-mono ${debt === 0 ? 'text-emerald-400' : 'text-rose-400'}">
                            ${debt.toLocaleString()} ج.م
                          </strong>
                        </div>
                        <div class="bg-[#080d19] px-4 py-2.5 rounded-2xl border border-slate-800 text-right">
                          <span class="text-[10px] text-slate-400 block">المستشار المسند إليه</span>
                          <span class="text-xs font-bold text-amber-300 flex items-center gap-1">
                            <i data-lucide="user-check" class="w-3.5 h-3.5 text-amber-400"></i>
                            <span>${escapeHtml(c.legal_assigned_to || 'أ. سامح عبد الفتاح')}</span>
                          </span>
                        </div>
                      </div>
                    </div>

                    <!-- Referral Reason Box -->
                    ${c.legal_reason ? `
                      <div class="p-3 rounded-2xl bg-[#080d19] border border-slate-800 text-xs text-slate-300 flex items-center gap-2">
                        <span class="font-bold text-rose-400 shrink-0">سبب الإحالة القضائية:</span>
                        <span>${escapeHtml(c.legal_reason)}</span>
                      </div>
                    ` : ''}

                    <!-- PINNED LATEST LEGAL NOTE (نوتة المتابعة اليومية) -->
                    ${latestNote ? `
                      <div class="p-4 rounded-2xl bg-gradient-to-r from-[#0d1627] to-[#0a101f] border border-amber-500/30 space-y-2">
                        <div class="flex items-center justify-between text-xs border-b border-slate-800/60 pb-2">
                          <div class="flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                            <span class="font-black text-amber-400 flex items-center gap-1">
                              <i data-lucide="message-square-code" class="w-3.5 h-3.5"></i>
                              <span>آخر إجراء وتعليق قانوني (${escapeHtml(latestNote.action_type || 'متابعة')}):</span>
                            </span>
                          </div>
                          <span class="text-[10px] text-slate-400 font-mono">
                            ${latestNote.date ? new Date(latestNote.date).toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '---'}
                          </span>
                        </div>

                        <p class="text-xs text-slate-200 leading-relaxed font-sans pr-3 border-r-2 border-amber-500">
                          "${escapeHtml(latestNote.text)}"
                        </p>

                        <div class="flex items-center justify-between pt-1 text-[11px] text-slate-400">
                          <span>بواسطة: <strong class="text-amber-300">${escapeHtml(latestNote.author || 'الشؤون القانونية')}</strong></span>
                          <span class="text-[10px] text-slate-500">محدث وموثق تلقائياً للمديرين والمشرفين</span>
                        </div>
                      </div>
                    ` : `

                      </div>

                    <!-- ACTION BUTTONS ROW -->

                      <!-- Quick Receipt Confirmation for pending files -->

                        ${isPendingReceipt ? `
                          <button 
                            onclick="acceptLegalFile('${c.client_code}')" 
                            class="touch-target px-4 py-2.5 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-gray-950 font-black text-xs transition flex items-center gap-2 cursor-pointer shadow-lg shadow-emerald-500/20 active:scale-95"
                          >
                            <i data-lucide="check-check" class="w-4 h-4"></i>
                            <span>تأكيد استلام الملف وبدء الإجراءات</span>
                          </button>

                        <button 
                          onclick="openAddLegalNoteModal('${c.client_code}')"

                          <i data-lucide="plus-circle" class="w-4 h-4"></i>

                          <span>إشعار واتساب</span>
                        </button>

                        ${!isSettled ? `

                    </div>

                  </div>

              }).join('')}
            </div>

          </div>

        state.legalFilter = f;
        render();
      };

      window.setLegalSearch = (q) => {
        state.legalSearch = q;
        render();
      };

      window.acceptLegalFile = async (clientCode) => {
        const client = state.clients.find(c => c.client_code === clientCode);
        if (!client) return;
        client.legal_status = 'قيد المتابعة والإجراءات القضائية';
        const authorName = state.currentUser ? `${state.currentUser.name} (${state.currentUser.role})` : 'الشؤون القانونية';
        if (!client.legal_notes) client.legal_notes = [];
        client.legal_notes.unshift({
          id: 'ln-' + Date.now(),
          date: new Date().toISOString(),
          author: authorName,
          action_type: 'تأكيد استلام الملف',
          text: `تم استلام ملف النزاع القضائي رسمياً وبدء الإجراءات ومراجعة أصل الفواتير وسندات الاستحقاق بواسطة ${authorName}.`
        });
        localStorage.setItem('tantawy_cache_clients', JSON.stringify(state.clients));
        showToast(`تم تأكيد استلام ملف العميل (${client.client_name}) والبدء في الإجراءات!`, 'success');
        render();
      };

      window.openLegalHistoryModal = (clientCode) => {
        const client = state.clients.find(c => c.client_code === clientCode);
        if (!client) return;
        state.legalHistoryClient = client;
        state.isLegalHistoryModalOpen = true;
        render();
      };

      window.closeLegalHistoryModal = () => {
        state.isLegalHistoryModalOpen = false;
        state.legalHistoryClient = null;
        render();
      };

      window.sendLegalWhatsAppNotice = (clientCode) => {
        const client = state.clients.find(c => c.client_code === clientCode);
        if (!client) return;

        state.isCartOpen = true;
        render();

      window.closeCart = () => {
        state.isCartOpen = false;
        render();

      window.addToCart = (productId) => {
        const product = state.products.find(p => p.id === productId);
        if (!product) return;
        const existing = state.cart.find(i => i.product.id === productId);
        if (existing) {
          existing.qtyCartons += 1;
        } else {
          state.cart.push({ product, qtyCartons: 1 });
        }
        showToast(`تمت إضافة كرتونة من "${product.name.slice(0, 22)}..."`, 'success');
        render();
      };

      window.updateCartQty = (productId, delta) => {
        const item = state.cart.find(i => i.product.id === productId);
        if (!item) return;
        item.qtyCartons += delta;
        if (item.qtyCartons <= 0) {
          state.cart = state.cart.filter(i => i.product.id !== productId);
        }
        render();
      };

      window.selectClientForOrder = (clientCode) => {
        const client = state.clients.find(c => c.client_code === clientCode);
        if (client) {
          state.selectedClient = client;
          state.activeTab = 'catalog';
          state.isCartOpen = true;
          render();
        }
      };

      window.submitOrder = async () => {
        const select = document.getElementById('order-client-select');
        const clientCode = select ? select.value : '';
        if (!clientCode) {
          showToast('يرجى اختيار العميل من القائمة أولاً', 'error');
          return;
        }

        const client = state.clients.find(c => c.client_code === clientCode);
        if (client && client.is_legal && (!client.legal_status || !client.legal_status.includes('تسوية'))) {
          showToast(`⚠️ تنبيه قضائي: العميل (${client.client_name}) محال للشؤون القانونية؛ لا يمكن إصدار فواتير جديدة له إلا بعد تصفير المديونية وإغلاق القضية!`, 'error');
          return;
        }
        const total = state.cart.reduce((sum, item) => sum + (item.qtyCartons * (item.product.promoPrice || item.product.cartonPrice)), 0);
        const currentDebt = client ? Number(client.debt || 0) : 0;
        const creditLimit = client ? Number(client.credit_limit || 50000) : 50000;
        const isLimitExceeded = (currentDebt + total) > creditLimit;

        const btn = document.getElementById('submit-order-btn');
        if (btn) {
          btn.disabled = true;
          btn.innerHTML = `<span class="inline-block w-4 h-4 border-2 border-gray-950 border-t-transparent rounded-full animate-spin"></span> جاري الحفظ...`;
        }

        const orderData = {
          delegate_name: state.currentUser.name || 'مندوب',
          branch: client ? (client.branch || state.currentUser.branch) : (state.currentUser.branch || 'المركز الرئيسي'),
          items: JSON.stringify(state.cart.map(i => ({
            name: i.product.name,
            code: i.product.code,
            qty: i.qtyCartons,
            price: i.product.promoPrice || i.product.cartonPrice,
            total: i.qtyCartons * (i.product.promoPrice || i.product.cartonPrice)
          }))),
          total: total,
          status: isLimitExceeded ? 'في انتظار موافقة المشرف (تجاوز الحد الائتماني)' : 'في انتظار موافقة المشرف',
          created_at: new Date().toISOString()
        };

        try {
          await postNewOrder(orderData);
          showToast(`تم تسجيل الطلبية بنجاح${isLimitExceeded ? ' (معلقة لموافقة المشرف)' : ''}!`, 'success');
          state.cart = [];
          state.isCartOpen = false;
          await fetchOrders();
          state.activeTab = 'orders';
          render();
        } catch (err) {
          showToast('تم حفظ الطلبية محلياً في وضع الأوفلاين، وسيتم الرفع تلقائياً', 'info');
          state.cart = [];
          state.isCartOpen = false;
          render();
        }
      };

      const SETUP_SQL_CODE = 
`-- ========================================================
-- 1. جدول المستخدمين ودالة تسجيل الدخول
-- ========================================================
create table if not exists public.users (
  id uuid primary key default gen_random_uuid(),
  name text not null,
  email text,
  username text unique,
  password text,
  role text default 'مندوب مبيعات',
  branch text default 'المركز الرئيسي',
  is_active boolean default true,
  created_at timestamptz default now()
);

-- دالة تسجيل الدخول الآمنة RPC
create or replace function public.app_login(p_username text, p_password text)
returns table (id uuid, name text, username text, role text, branch_name text)
language sql
security definer
set search_path = public
as $$
  select u.id, u.name, u.username, u.role, u.branch as branch_name
  from users u
  where (u.username = p_username or u.email = p_username)
    and u.password = p_password
    and coalesce(u.is_active, true) = true;
$$;

grant execute on function public.app_login(text, text) to anon, authenticated;

-- ========================================================
-- 2. فتح صلاحيات RLS للقراءة والكتابة
-- ========================================================
alter table public.users enable row level security;
alter table public.clients enable row level security;
alter table public.products enable row level security;
alter table public.orders enable row level security;
alter table public.visits enable row level security;

create policy "Allow anon select users" on public.users for select to anon using (true);
create policy "Allow anon select clients" on public.clients for select to anon using (true);
create policy "Allow anon insert clients" on public.clients for insert to anon with check (true);

create policy "Allow anon select products" on public.products for select to anon using (true);
create policy "Allow anon insert products" on public.products for insert to anon with check (true);

create policy "Allow anon select orders" on public.orders for select to anon using (true);
create policy "Allow anon insert orders" on public.orders for insert to anon with check (true);
create policy "Allow anon update orders" on public.orders for update to anon using (true);

create policy "Allow anon select visits" on public.visits for select to anon using (true);
create policy "Allow anon insert visits" on public.visits for insert to anon with check (true);

-- ========================================================
-- 3. بذر مستخدمي مجموعة الطنطاوي الأساسيين
-- ========================================================
insert into public.users (name, email, username, password, role, branch)
values
  ('أحمد طنطاوي', 'ahmed@tantawy.com', 'ahmed_rep', '123456', 'مندوب مبيعات', 'القاهرة'),
  ('إسلام محمود', 'eslam@tantawy.com', 'eslam_rep', '123456', 'مندوب مبيعات', 'المنيا'),
  ('م. خالد الطنطاوي', 'khaled@tantawy.com', 'khaled_sup', '123456', 'مشرف فروع', 'المركز الرئيسي'),
  ('الحاج طنطاوي', 'admin@tantawy.com', 'admin', 'admin123', 'مدير عام', 'المركز الرئيسي')
on conflict (username) do nothing;`;

      // ==========================================
      // 8. APP INITIAL BOOTSTRAP
      // ==========================================
      async function init() {
        try {
          await checkSupabaseConnection();
          const saved = localStorage.getItem('tantawy_auth_user');
          if (saved) {
            try {
              state.currentUser = JSON.parse(saved);
              await loadUserData();
              syncOfflineQueue();
            } catch(e) {
              localStorage.removeItem('tantawy_auth_user');
            }
          }
        } catch (e) {
          console.error("Initialization error:", e);
        } finally {
          render();
        }
      }

      init();
