      // Cap all network requests with a fast timeout so app never freezes
      async function fetchWithTimeout(resource, options = {}, timeout = 3000) {
        const controller = new AbortController();
        const id = setTimeout(() => controller.abort(), timeout);
        try {
          const response = await fetch(resource, {
            ...options,
            signal: controller.signal
          });
          clearTimeout(id);
          return response;
        } catch (error) {
          clearTimeout(id);
          throw error;
        }
      }

      function safeCreateIcons() {
        if (typeof lucide !== 'undefined' && lucide && lucide.createIcons) {
          try {

          } catch(e) {}
        }
      }
      window.addEventListener('load', safeCreateIcons);

      function showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        if (!container) return;
        const toast = document.createElement('div');
        toast.className = `toast-animate pointer-events-auto px-4 py-3 rounded-2xl text-xs font-bold shadow-2xl flex items-center gap-2.5 max-w-sm w-full border backdrop-blur-xl ${
          type === 'success' ? 'bg-emerald-950/90 text-emerald-200 border-emerald-500/40 shadow-emerald-950/50' :
          type === 'error' ? 'bg-rose-950/90 text-rose-200 border-rose-500/40 shadow-rose-950/50' :
          type === 'warning' ? 'bg-amber-950/90 text-amber-200 border-amber-500/40 shadow-amber-950/50' :
          'bg-slate-900/90 text-slate-100 border-slate-700 shadow-black/50'
        }`;
        
        const iconName = type === 'success' ? 'check-circle-2' : type === 'error' ? 'alert-octagon' : type === 'warning' ? 'alert-triangle' : 'info';
        toast.innerHTML = `
          <i data-lucide="${iconName}" class="w-4 h-4 shrink-0"></i>
          <span class="flex-1 leading-snug">${escapeHtml(message)}</span>
        `;
        container.appendChild(toast);
        safeCreateIcons();
        setTimeout(() => {
          toast.style.transition = 'all 0.3s ease';
          toast.style.opacity = '0';
          toast.style.transform = 'translateY(-15px)';
          setTimeout(() => toast.remove(), 300);
        }, 3600);
      }

      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');

        // Sync State

        googleSheetsSyncMsg: '',
        pendingOrders: JSON.parse(localStorage.getItem('tantawy_offline_orders') || '[]'),
        pendingVisits: JSON.parse(localStorage.getItem('tantawy_offline_visits') || '[]'),
        proposalPillar: 'rep'

      // Set initial theme

      // Role check helpers
      function isRep(role) {
        if (!role) return false;
        const r = String(role).toLowerCase();
        return r.includes('مندوب') || r.includes('rep') || r.includes('sales');
      }

      function isSupervisor(role) {
        if (!role) return false;
        const r = String(role).toLowerCase();
        return r.includes('مشرف') || r.includes('supervisor');
      }

      function isBranchManager(role) {
        if (!role) return false;
        const r = String(role).toLowerCase();
        return r.includes('مدير فرع') || r.includes('branch manager');
      }

      function isExecManager(role) {
        if (!role) return false;
        const r = String(role).toLowerCase();
        return r.includes('مدير إدارة') || r.includes('مدير اداره') || r.includes('exec');
      }

      function isAdmin(role) {
        if (!role) return false;
        const r = String(role).toLowerCase();
        return r.includes('عام') || r.includes('نظام') || r.includes('admin') || r.includes('super');
      }

      function isLegal(role) {
        if (!role) return false;
        const r = String(role).toLowerCase();
        return r.includes('قانون') || r.includes('legal') || r.includes('محام');
      }

        if (isAdmin(role)) return true;
        
        const allowed = state.rolePermissions[role] || DEFAULT_ROLE_PERMISSIONS[role] || [];
        return allowed.includes(screenId);

      // ==========================================

      async function checkSupabaseConnection() {
        try {
          const res = await fetchWithTimeout(`${SUPABASE_URL}users?select=*&limit=1`, { headers }, 2500);
          state.dbConnected = res.ok;
        } catch (e) {
          state.dbConnected = false;
        }
      }

      async function syncOfflineQueue() {
        if (!navigator.onLine) return;
        let syncedCount = 0;

        const pendingOrders = JSON.parse(localStorage.getItem('tantawy_offline_orders') || '[]');
        if (pendingOrders.length > 0) {
          const remainingOrders = [];
          for (const order of pendingOrders) {
            try {
              const res = await fetch(`${SUPABASE_URL}orders`, {
                method: 'POST',
                headers,
                body: JSON.stringify(order)
              });
              if (res.ok) syncedCount++;
              else remainingOrders.push(order);
            } catch (e) {
              remainingOrders.push(order);
            }
          }
          state.pendingOrders = remainingOrders;
          localStorage.setItem('tantawy_offline_orders', JSON.stringify(remainingOrders));
        }

        const pendingVisits = JSON.parse(localStorage.getItem('tantawy_offline_visits') || '[]');
        if (pendingVisits.length > 0) {
          const remainingVisits = [];
          for (const visit of pendingVisits) {
            try {
              const res = await fetch(`${SUPABASE_URL}visits`, {
                method: 'POST',
                headers,
                body: JSON.stringify(visit)
              });
              if (res.ok) syncedCount++;
              else remainingVisits.push(visit);
            } catch (e) {
              remainingVisits.push(visit);
            }
          }
          state.pendingVisits = remainingVisits;
          localStorage.setItem('tantawy_offline_visits', JSON.stringify(remainingVisits));

      async function apiLogin(identifier, password) {
        const clean = identifier.trim();
        const cleanPass = password.trim();

        // 1. FAST PRESET USERS (Instant Login)
        const matchedPreset = PRESET_USERS.find(p => 
          p.username.toLowerCase() === clean.toLowerCase() || 
          p.email.toLowerCase() === clean.toLowerCase() ||
          p.name.includes(clean)
        );
        if (matchedPreset && (cleanPass === '123456' || cleanPass === matchedPreset.username || !cleanPass || cleanPass === 'admin')) {
          return matchedPreset;
        }

        // 2. RPC check
        try {
          const rpcRes = await fetchWithTimeout(`${SUPABASE_URL}rpc/app_login`, {
            method: 'POST',
            headers,
            body: JSON.stringify({ p_username: clean, p_password: cleanPass })
          }, 3500);
          if (rpcRes.ok) {
            const data = await rpcRes.json();
            const u = Array.isArray(data) ? data[0] : data;
            if (u && u.id) {
              return {
                id: u.id,
                name: u.name || u.username,
                email: u.email || u.username || clean,
                role: u.role || 'مندوب مبيعات',
                branch: u.branch_name || u.branch || 'المركز الرئيسي'
              };
            }
          }
        } catch (rpcErr) {}

        if (matchedPreset) return matchedPreset;
        return null;
      }

      // 5. ULTRA-FAST GOOGLE SHEETS CSV SYNC ENGINE
      // ==========================================
      function parseCSVText(csvText) {
        const lines = csvText.trim().split(/\r\n|\n/);
        if (lines.length < 2) return [];

        const parseLine = (line) => {
          const result = [];
          let current = '';
          let inQuotes = false;
          for (let i = 0; i < line.length; i++) {
            const char = line[i];
            if (char === '"') {
              inQuotes = !inQuotes;
            } else if (char === ',' && !inQuotes) {
              result.push(current.trim());
              current = '';
            } else {
              current += char;
            }
          }
          result.push(current.trim());
          return result;
        };

        const headers = parseLine(lines[0]).map(h => h.replace(/^["']|["']$/g, '').toLowerCase());
        const rows = [];

        for (let i = 1; i < lines.length; i++) {
          if (!lines[i].trim()) continue;
          const values = parseLine(lines[i]).map(v => v.replace(/^["']|["']$/g, ''));
          const rowObj = {};
          headers.forEach((h, index) => {
            rowObj[h] = values[index] || '';
          });
          rows.push(rowObj);
        }
        return rows;
      }

      window.confirmSettleDebt = async (clientCode, amount, isFullZeroing, settlementNotes) => {
        const client = state.clients.find(c => c.client_code === clientCode);
        if (!client) return;

        const currentDebt = Number(client.debt || 0);
        const paidAmount = Number(amount || 0);
        const newDebt = isFullZeroing ? 0 : Math.max(0, currentDebt - paidAmount);

        client.debt = newDebt;

        if (newDebt === 0 || isFullZeroing) {
          client.legal_status = 'تمت التسوية وتصفير المديونية وإغلاق الملف';
        }

        if (!client.legal_notes) client.legal_notes = [];
        const authorName = state.currentUser ? `${state.currentUser.name} (${state.currentUser.role})` : 'الشؤون القانونية';

        client.legal_notes.unshift({
          id: 'ln-' + Date.now(),
          date: new Date().toISOString(),
          author: authorName,
          action_type: isFullZeroing ? 'تصفير المديونية وإغلاق الملف' : 'تحصيل قضائي جزئي',

        const collectionRecord = {
          client_code: client.client_code,
          client_name: client.client_name,
          mandoub_name: authorName,
          type: 'تحصيل قضائي (تسوية)',
          amount: paidAmount > 0 ? paidAmount : currentDebt,
          notes: `سداد قانوني لحساب القضية: ${settlementNotes || 'مخالصة وتصفير الحساب'}`,

        const u = state.currentUser;
        const myClients = state.clients.filter(c => !isRep(u.role) || (c.mandoub_name && c.mandoub_name.includes(u.name)));
        
        const filtered = myClients.filter(c => {
          if (!state.clientSearch) return true;
          const q = state.clientSearch.toLowerCase();
          return (c.client_name && c.client_name.toLowerCase().includes(q)) ||
                 (c.client_code && c.client_code.toLowerCase().includes(q)) ||
                 (c.phone && c.phone.includes(q));

          if (state.ordersFilter === 'خرج للتسليم') return (o.status || '').includes('تسليم') || (o.status || '').includes('خرجت');

                    <div class="flex-1 min-w-0">

                      <button onclick="updateCartQty('${item.product.id}', 1)" class="w-8 h-8 rounded-xl bg-slate-800 text-white font-bold flex items-center justify-center cursor-pointer active:scale-95 transition">+</button>

                  ${state.cart.length === 0 ? 'disabled' : ''}
                  class="w-full touch-target py-3.5 rounded-2xl bg-amber-500 hover:bg-amber-400 disabled:opacity-40 text-gray-950 font-black text-sm transition cursor-pointer flex items-center justify-center gap-2 shadow-lg shadow-amber-500/20 active:scale-95"

                </button>
              </div>

            </div>
          </div>
        `;
      }

      window.openCart = () => { state.isCartOpen = true; render(); };
      window.closeCart = () => { state.isCartOpen = false; render(); };

      window.addToCart = (productId) => {
        const product = state.products.find(p => p.id === productId);
        if (!product) return;
        const existing = state.cart.find(i => i.product.id === productId);
        if (existing) existing.qtyCartons += 1;
        else state.cart.push({ product, qtyCartons: 1 });
        showToast(`تمت إضافة كرتونة من "${product.name.slice(0, 22)}..."`, 'success');
        render();
      };

      window.updateCartQty = (productId, delta) => {
        const item = state.cart.find(i => i.product.id === productId);
        if (!item) return;
        item.qtyCartons += delta;
        if (item.qtyCartons <= 0) state.cart = state.cart.filter(i => i.product.id !== productId);
        render();
      };

      window.selectClientForOrder = (clientCode) => {
        state.selectedClient = state.clients.find(c => c.client_code === clientCode) || null;
        state.isCartOpen = true;
        render();
      };

      window.submitOrder = async () => {
        const clientCode = document.getElementById('order-client-select')?.value;
        if (!clientCode) {
          showToast('يرجى اختيار العميل من القائمة أولاً', 'error');
          return;
        }

        const client = state.clients.find(c => c.client_code === clientCode);
        const total = state.cart.reduce((sum, item) => sum + (item.qtyCartons * (item.product.promoPrice || item.product.cartonPrice)), 0);

        const orderData = {
          delegate_name: state.currentUser ? state.currentUser.name : 'مندوب',
          branch: client ? client.branch : (state.currentUser ? state.currentUser.branch : 'المركز الرئيسي'),
          items: JSON.stringify(state.cart.map(i => ({
            name: i.product.name,
            code: i.product.code,
            qty: i.qtyCartons,
            price: i.product.promoPrice || i.product.cartonPrice,
            total: i.qtyCartons * (i.product.promoPrice || i.product.cartonPrice)
          }))),
          total,
          status: 'قيد المراجعة والاعتماد بالمستودع',
          created_at: new Date().toISOString()
        };

        await postNewOrder(orderData);
        showToast('تم تسجيل الطلبية بنجاح وإرسال إشعار للمستودع!', 'success');
        state.cart = [];
        state.isCartOpen = false;
        state.activeTab = 'orders';
        render();
      };

        render();

      // ==========================================
      // 13. APP BOOTSTRAP
      // ==========================================
      async function init() {
        try {
          // Instant load from storage
          const saved = localStorage.getItem('tantawy_auth_user');
          if (saved) {
            try {
              state.currentUser = JSON.parse(saved);
              if (isRep(state.currentUser.role)) state.activeTab = 'rep_home';
              else if (isLegal(state.currentUser.role)) state.activeTab = 'legal';
              else if (isExecManager(state.currentUser.role)) state.activeTab = 'proposals';
            } catch(e) {
              localStorage.removeItem('tantawy_auth_user');
            }
          }

          const cachedProducts = localStorage.getItem('tantawy_cache_products');
          if (cachedProducts) {
            try { state.products = JSON.parse(cachedProducts); } catch(e){}
          }
          if (!state.products) state.products = DEFAULT_PRODUCTS;

          const cachedClients = localStorage.getItem('tantawy_cache_clients');
          if (cachedClients) {
            try { state.clients = JSON.parse(cachedClients); } catch(e){}
          }
          if (!state.clients) state.clients = DEFAULT_CLIENTS;

          const cachedVisits = localStorage.getItem('tantawy_cache_visits');
          if (cachedVisits) {
            try { state.visits = JSON.parse(cachedVisits); } catch(e){}
          }

          const cachedOrders = localStorage.getItem('tantawy_cache_orders');
          if (cachedOrders) {
            try { state.orders = JSON.parse(cachedOrders); } catch(e){}
          }

          render();

          // Background sync
          setTimeout(async () => {
            try {
              await checkSupabaseConnection();
              if (state.currentUser) {
                await loadUserData();
                syncOfflineQueue();
                render();
              }
            } catch(bgErr) {}
          }, 150);

        } catch (e) {
          console.error("Initialization error:", e);
          render();
        }
      }

      init();
    </script>
