name: Deploy Flutter Web to Vercel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # يتيح لك تشغيل البيلد يدوياً بضغطة زر واحدة من واجهة GitHub

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب الكود من GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. تثبيت Flutter على سيرفرات GitHub السحابية
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      # 3. تثبيت الحزم وبناء نسخة الويب لـ Flutter
      - name: Build Flutter Web
        working-directory: ./flutter_tantawy
        run: |
          flutter pub get
          flutter build web --release --base-href /

      # 4. رفع ونشر ملفات الويب الجاهزة أوتوماتيجياً إلى Vercel
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./flutter_tantawy
          vercel-args: '--prod'
          vercel-scope: ${{ secrets.VERCEL_SCOPE }}